# The published feeds: a [[feed]] table for each Hacker News feed, [[digest]]
# for a daily HN digest, [[rss]] for items from other sites' feeds. A push to
# main republishes them; removing a feed stops publishing its file.
#
#   file          the file name under https://feeds.michelebologna.net/
#   title         the feed's title in the reader
#   tags          Algolia tags: front_page, story, show_hn, ask_hn, ...
#                 (comma-separated tags must all match). With front_page the
#                 feed follows the current front page; otherwise it takes the
#                 newest matching stories of the last window_hours.
#   min_points    only stories with at least this many points (default 0)
#   min_comments  only stories with at least this many comments (default 0)
#   window_hours  how long a story stays in the feed after it first matched
#                 (default 48); a story that still matches always stays
#   max_items     the most items the feed holds (default 150)
#   ranked        true: only stories in HN's current ranking (the ~500 ids of
#                 topstories.json), at any age (default false)

[[feed]]
file = "frontpage.xml"
title = "Hacker News: front page"
tags = "front_page"

[[feed]]
file = "best.xml"
title = "Hacker News: 100+ points"
tags = "story"
min_points = 100

# What the @hacker_news_feed Telegram bot (phil-r/hackernewsbot) posts: ranked
# stories with 150+ points, including older ones still ranked.
[[feed]]
file = "top.xml"
title = "Hacker News: top stories, 150+ points"
tags = "story"
min_points = 150
ranked = true
# About 170 of the ~500 ranked stories have 150+ points (2026-11-19): room
# for all of them, as the bot eventually posts every one.
max_items = 250

# One item per UTC day with that day's top stories by points.
#
#   file          the file name, as for [[feed]]
#   title         the feed's title
#   top           stories per day (default 20)
#   days          days kept (default 7)
#   publish_hour  the UTC hour of the next day when a day appears (default 6:
#                 07:00 in Rome in winter, by when late stories have scored)
[[digest]]
file = "digest.xml"
title = "Hacker News: daily digest"

# Items from RSS or Atom feeds, filtered, merged and enriched. Each [[rss]]
# table publishes one feed:
#
#   file                the file name, as for [[feed]]
#   title               the feed's title
#   source / sources    one feed URL, or a list of them merged into one feed
#   include_categories  keep only items with one of these categories
#   exclude_categories  drop items with any of these categories
#   include_sections    keep only items whose first category is one of these
#   exclude_sections    drop items whose first category is one of these
#                       (all four match the whole category, ignoring case;
#                       the first category is the section on WordPress sites)
#   include_titles      keep only items whose title matches one of these
#   exclude_titles      drop items whose title matches any of these
#   include_links       keep only items whose link matches one of these
#   exclude_links       drop items whose link matches any of these
#                       (all four are regular expressions, matched anywhere;
#                       start one with (?i) to ignore case)
#   exclude_authors     drop items by these authors (whole name, ignoring case)
#   enrich              fetch each article's image and excerpt when the source
#                       lacks them (default true)
#   max_items           the most items the feed holds (default 100)
#   dedupe              "link" (default): items with the same canonical link
#                       or guid are one; "link+title": also items with the
#                       same normalised title
#
# Includes apply first, then excludes. Items keep the source's title, link,
# guid, date and categories.

# News Site, without the daily Peanuts strip, the photo of the day, celebrity
# news, podcast episodes, newsletters or the front-page review.
[[rss]]
file = "newssite.xml"
title = "News Site: articles"
# /feed, not /feed/: the trailing slash often gets a cached 403.
source = "https://www.newssite.example/feed"
exclude_categories = ["peanuts", "foto del giorno", "celebrity"]
exclude_links = ['^https://www\.newssite\.example/(episodes|newsletter)/']
exclude_titles = ['(?i)^le prime pagine']

# Tech Site. index lists every article, but only the newest 20 (about 3
# days): it brings AI, Science and Health, which have no feeds of their own.
# The section feeds keep older items, such as month-old Features. A story in
# several feeds appears once.
#
# Sections are excluded by an item's first category, its section, not by any
# category: articles worth keeping carry these names as tags too (the GTA VI
# review is Features, tagged Gaming). An exclude list, so a section Tech Site adds
# later comes through.
[[rss]]
file = "techsite.xml"
title = "Tech Site"
sources = [
  "https://feeds.techsite.example/index",
  "https://feeds.techsite.example/features",
  "https://feeds.techsite.example/technology-lab",
  "https://feeds.techsite.example/gadgets",
  "https://feeds.techsite.example/apple",
]
exclude_sections = ["Policy", "Space", "Gaming", "Cars", "Culture"]
