name: CI

# Tests on every push and pull request, with a check of the example
# feeds.toml and a browser test of the web editor. On main (a push or a
# dispatch) the build then reads the private feeds.toml, fetches the stories
# and their previews, and writes the feeds to Workers KV; the editor alone goes
# to GitHub Pages.
#
# Every 30 minutes a Cloudflare Worker's Cron Trigger (configured in a
# private repository) dispatches this workflow with build_only, and so does a
# change to the private feeds.toml: GitHub's own schedule ran hours late, or
# not at all, while a dispatch starts at once. Those runs skip the tests,
# which already passed on the push that put the code on main.
#
# The previous run's state.json comes from KV, so the workflow needs no
# commits and no cache.
#
# GitHub's Monday schedule runs the tests and the build too, and cuts the
# weekly release (auto-release); a late or skipped run only delays it.

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_only:
        description: Skip the tests and only build and publish the feeds
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be deploying.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  python:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_only) }}
    uses: mbologna/.github/.github/workflows/python-ci.yml@79683238e18472a0b4f68dfbf596783e5e36fc15 # main
    with:
      python_version: "3.15"
      enable_codecov: false
    secrets: inherit

  # The build's own validation of the example feeds.toml. The real one is
  # private: mbologna/feeds-config checks its own changes the same way.
  config:
    name: Check feeds.toml
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_only) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.15"

      - name: Check the example feeds.toml
        run: uv run --locked --no-dev feed-refinery check-config examples/feeds.toml

  # The web editor in Chromium: Pyodide from jsDelivr and the packages from
  # PyPI, the wheel built here, GitHub and the source relay mocked. The
  # python job skips this test: it needs the editor dependency group.
  editor:
    name: Editor
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_only) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.15"

      - name: Install Chromium
        run: uv run --locked --group editor playwright install --with-deps chromium

      - name: Test the editor in a browser
        run: uv run --locked --group editor pytest tests/test_editor_browser.py

  # Monday's run tags the next version and publishes a GitHub Release with
  # the changes as its notes; nothing builds on tags, Pages deploys from main.
  auto-release:
    needs: [python]
    # The reusable workflow releases on every manual run: keep the 30-minute
    # build_only dispatches from cutting one each time.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_only) }}
    # contents: push the tag and create the Release.
    permissions:
      contents: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@79683238e18472a0b4f68dfbf596783e5e36fc15 # main
    with:
      strategy: conventional
      dispatch_tag_build: false
    secrets: inherit

  # The feeds: built from the private feeds.toml of mbologna/feeds-config
  # (checked out with a read-only deploy key) and written to Workers KV, which
  # the feeds Worker serves behind a token. This log is public, so the build
  # prints totals only, and nothing of the feeds goes to Pages or an artifact.
  build:
    name: Build and publish the feeds
    needs: python
    # needs alone would skip the build whenever the tests are skipped.
    if: >-
      !cancelled()
      && (needs.python.result == 'success' || needs.python.result == 'skipped')
      && github.event_name != 'pull_request'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_KV_NAMESPACE: ${{ vars.CLOUDFLARE_KV_NAMESPACE }}
      CLOUDFLARE_KV_TOKEN: ${{ secrets.CLOUDFLARE_KV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the private feeds.toml
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mbologna/feeds-config
          ssh-key: ${{ secrets.FEEDS_CONFIG_DEPLOY_KEY }}
          path: config
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.15"

      - name: Read the previous state
        run: uv run --locked --no-dev feed-refinery kv-get state.json previous-state.json

      - name: Build
        run: >-
          uv run --locked --no-dev feed-refinery build --quiet --config config/feeds.toml
          --previous-state previous-state.json --output-dir public

      - name: Publish to KV
        run: uv run --locked --no-dev feed-refinery kv-publish public --config config/feeds.toml

  # The web editor at /editor/, alone on Pages: its files, the feed-refinery wheel it
  # runs in the browser, and the locked versions of the packages that wheel
  # needs from PyPI. tests/test_editor_browser.py assembles it the same way.
  editor-site:
    name: Assemble the editor
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.15"

      - name: Assemble the editor
        run: |
          set -euo pipefail
          mkdir site
          cp -R src/feed_refinery/site/editor site/editor
          cp src/feed_refinery/site/favicon.svg site/editor/
          uv build --wheel --out-dir dist
          cp dist/feed_refinery-*.whl site/editor/feed_refinery.whl
          uv export --frozen --only-group pyodide --no-hashes --no-annotate --no-header > site/editor/requirements.txt

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy the editor to GitHub Pages
    needs: editor-site
    if: ${{ !cancelled() && needs.editor-site.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  freshness:
    name: Check the published feeds
    needs: build
    # Also runs when the build failed, so a broken build shows up as stale
    # feeds once it has gone on for over 3 hours. /health counts problems and
    # never names a feed.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Fail if the feeds' /health is down
        run: curl -fsS --retry 2 https://feeds.michelebologna.net/health
